/* Modal + toast */
.overlay { position: fixed; inset: 0; background: rgba(8,16,13,.45); display: grid; place-items: center; padding: 16px; z-index: 50; }

<script>
"use strict";
/* ============================================================
   Rich Life Ledger — a private, encrypted personal finance app.
   All financial data is encrypted in the browser (AES-256-GCM,
   key derived from your passphrase with PBKDF2-SHA256, 600k
   iterations). Only ciphertext is ever stored or synced.
   ============================================================ */

const KDF_ITER = 600000;
const LOCAL_KEY = "rll.vault.v1";
const IDLE_LOCK_MS = 10 * 60 * 1000;
const CHUNK = 200000;

const BUCKETS = {
  fixed:  { label: "Fixed costs",         color: "var(--b-fixed)",  min: 50, max: 60, note: "Rent, utilities, debt, insurance, groceries" },
  invest: { label: "Investments",         color: "var(--b-invest)", min: 10, max: 100, note: "401(k), Roth IRA, brokerage" },
  save:   { label: "Savings goals",       color: "var(--b-save)",   min: 5,  max: 10, note: "Emergency fund, vacation, gifts, down payment" },
  guilt:  { label: "Guilt-free spending", color: "var(--b-guilt)",  min: 20, max: 35, note: "Dining, travel, hobbies, the fun stuff" },
};
const DEFAULT_CATEGORIES = [
  ["Paycheck", "income"], ["Other income", "income"],
  ["Rent / mortgage", "fixed"], ["Utilities", "fixed"], ["Phone & internet", "fixed"], ["Insurance", "fixed"],
  ["Groceries", "fixed"], ["Transportation", "fixed"], ["Debt payments", "fixed"], ["Subscriptions", "fixed"], ["Health", "fixed"],
  ["401(k) / IRA", "invest"], ["Brokerage", "invest"],
  ["Emergency fund", "save"], ["Vacation fund", "save"], ["Gifts fund", "save"], ["Big purchase fund", "save"],
  ["Dining out", "guilt"], ["Entertainment", "guilt"], ["Shopping", "guilt"], ["Travel", "guilt"], ["Hobbies", "guilt"],
  ["Transfer", "transfer"], ["Uncategorized", "none"],
].map(([name, bucket]) => ({ name, bucket }));

const AUTO_RULES = [
  [/payroll|direct dep|salary|paycheck/i, "Paycheck"],
  [/\brent\b|mortgage|apartment|property mgmt/i, "Rent / mortgage"],
  [/electric|water|gas co|utility|pg&e|con ed|duke energy/i, "Utilities"],
  [/verizon|at&t|t-mobile|comcast|xfinity|spectrum|internet/i, "Phone & internet"],
  [/geico|state farm|progressive|allstate|insurance/i, "Insurance"],
  [/whole foods|trader joe|safeway|kroger|aldi|costco|grocery|market|publix|heb/i, "Groceries"],
  [/uber|lyft|shell|chevron|exxon|bp |transit|metro|parking|toll/i, "Transportation"],
  [/netflix|spotify|hulu|disney\+|apple\.com|icloud|youtube|subscription|prime/i, "Subscriptions"],
  [/pharmacy|cvs|walgreens|doctor|dental|clinic/i, "Health"],
  [/401k|401\(k\)|\bira\b|vanguard|fidelity|schwab/i, "401(k) / IRA"],
  [/restaurant|cafe|coffee|starbucks|doordash|grubhub|chipotle|pizza|bar |grill/i, "Dining out"],
  [/amazon|target|walmart|best buy|etsy/i, "Shopping"],
  [/airline|delta|united|southwest|airbnb|hotel|marriott|hilton/i, "Travel"],
  [/cinema|movie|ticketmaster|steam|playstation|concert/i, "Entertainment"],
  [/transfer|zelle|venmo/i, "Transfer"],
];

/* Paraphrased principles from Ramit Sethi's "I Will Teach You to Be Rich" (2nd ed., 2019).
   Written as summaries, not quotations, except where marked as a short quote. */
const RAMIT = {
  dashboard: [
    { t: "Design your Rich Life first. Money is a tool for the life you want, so decide what that life looks like, then point your money at it.", s: "Ch. 1 & Ch. 4" },
    { t: "Focus on the big wins (your rent, your car, your investing rate, your career) instead of agonizing over a $5 coffee. A handful of big decisions matter more than hundreds of tiny ones.", s: "Ch. 4" },
    { t: "Short quote: “Spend extravagantly on the things you love, and cut costs mercilessly on the things you don’t.”", s: "Ch. 4" },
  ],
  transactions: [
    { t: "You don't need a perfect budget. Look at your real spending, sort it into a few buckets, and fix the biggest leak. Getting started beats getting it perfect: the 85% solution.", s: "Ch. 4" },
    { t: "Use your credit card for the rewards and the tracking, then pay the full statement balance every month. Never carry a balance.", s: "Ch. 1" },
    { t: "Call and negotiate. Phone, internet, insurance and bank fees often drop with one polite phone call asking for a better rate.", s: "Ch. 1 & Ch. 2" },
  ],
  accounts: [
    { t: "Keep a no-fee, no-minimum checking account, and put your savings in a high-yield online savings account. Banks shouldn't charge you to hold your money.", s: "Ch. 2" },
    { t: "Your credit score is a big win: pay on time, keep old cards open, and keep utilization low. A better score saves real money on a car loan or mortgage.", s: "Ch. 1" },
    { t: "If you have debt, list every balance and rate, pick a payoff method, and automate extra payments. Paying the highest-rate debt first saves the most interest.", s: "Ch. 1" },
  ],
  plan: [
    { t: "The Conscious Spending Plan has four buckets: fixed costs (50–60% of take-home), investments (about 10%), savings goals (5–10%), and guilt-free spending (20–35%).", s: "Ch. 4" },
    { t: "If fixed costs are over 60%, that's the place to work. A cheaper apartment or car frees more money than any amount of coupon clipping.", s: "Ch. 4" },
    { t: "Guilt-free spending is meant to be spent. Once investments and savings are handled, enjoy that money without second-guessing it.", s: "Ch. 4" },
  ],
  goals: [
    { t: "Give each goal its own savings sub-account with a name (“Japan trip”, “Wedding”) and a monthly amount. Named goals are much easier to stick with.", s: "Ch. 4 & Ch. 5" },
    { t: "Automate it. Set up automatic transfers the day after payday: retirement first, then savings goals, then bills. What's left is yours to spend.", s: "Ch. 5" },
    { t: "Invest early and keep it simple: take the full 401(k) match, open a Roth IRA, and use a low-cost target-date fund or index funds. Time in the market matters more than picking stocks.", s: "Ch. 3 & Ch. 6–7" },
  ],
};

/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
const money = (n, opts = {}) => {
  const v = Number(n) || 0;
  const s = Math.abs(v).toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: opts.cents === false ? 0 : 2 });
  return (v < 0 ? "−" : opts.sign && v > 0 ? "+" : "") + s;
};
const pct = (n) => (isFinite(n) ? Math.round(n) : 0) + "%";
const monthKey = (iso) => iso.slice(0, 7);
const monthName = (key) => { const [y, m] = key.split("-"); return new Date(+y, +m - 1, 1).toLocaleString("en-US", { month: "long", year: "numeric" }); };
const shortMonth = (key) => { const [y, m] = key.split("-"); return new Date(+y, +m - 1, 1).toLocaleString("en-US", { month: "short" }); };
const todayISO = () => new Date().toISOString().slice(0, 10);
const b64 = (buf) => { let s = ""; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0));
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2600); }

/* ---------- crypto ---------- */
async function deriveKey(pass, salt, iter = KDF_ITER) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(obj, key, salt) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { v: 1, kdf: "PBKDF2-SHA256", iter: KDF_ITER, salt: b64(salt), iv: b64(iv), ct: b64(ct), updatedAt: Date.now() };
}
async function openEnvelope(env, key) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(env.iv) }, key, unb64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- storage: local cache + encrypted cloud sync ---------- */
const S = { key: null, salt: null, data: null, cloud: null, uid: null, syncState: "local", saveTimer: null, lastEnvelope: null };

async function cloudInit() {
  try {
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    S.cloud = db; S.uid = id; S.syncState = "on";
  } catch { S.cloud = null; }
}
function vaultRef(suffix = "") { return S.cloud.doc("data/users/" + S.uid + "/vault" + suffix); }

async function cloudRead() {
  if (!S.cloud) return null;
  try {
    const meta = await vaultRef().get();
    if (!meta.exists) return null;
    const m = meta.data();
    let ct = "";
    for (let i = 0; i < m.chunks; i++) {
      const c = await vaultRef("-c" + i).get();
      if (!c.exists || c.data().iv !== m.iv) return null;
      ct += c.data().ct;
    }
    return { v: m.v, kdf: m.kdf, iter: m.iter, salt: m.salt, iv: m.iv, ct, updatedAt: m.updatedAt };
  } catch { return null; }
}
async function cloudWrite(env) {
  if (!S.cloud) return;
  setSync("busy");
  try {
    const prev = await vaultRef().get();
    const prevChunks = prev.exists ? prev.data().chunks || 0 : 0;
    const parts = [];
    for (let i = 0; i < env.ct.length; i += CHUNK) parts.push(env.ct.slice(i, i + CHUNK));
    if (!parts.length) parts.push("");
    for (let i = 0; i < parts.length; i++) await vaultRef("-c" + i).set({ iv: env.iv, ct: parts[i] });
    await vaultRef().set({ v: env.v, kdf: env.kdf, iter: env.iter, salt: env.salt, iv: env.iv, updatedAt: env.updatedAt, chunks: parts.length });
    for (let i = parts.length; i < prevChunks; i++) await vaultRef("-c" + i).delete();
    setSync("on");
  } catch (e) {
    setSync("err");

/* ---------- charts ---------- */
function cspMeters(s, base) {
  if (!base) return `<p class="muted">Add your take-home pay on the Spending plan page to compare against Ramit's ranges.</p>`;
  return `<div style="display:grid;gap:14px">${Object.entries(BUCKETS).map(([k, b]) => {

    const zMax = k === "invest" ? 100 : b.max;
    return `<div class="meter"><div class="top"><span>${bucketChip(k)}</span><span class="num">${pct(p)} <span class="muted">/ ${k === "invest" ? "10%+" : b.min + "–" + b.max + "%"}</span></span></div>
      <div class="track"><div class="zone" style="left:${b.min}%;width:${zMax - b.min}%;${k === "invest" ? "border-right:0" : ""}"></div><div class="fill" style="width:${Math.min(100, p)}%;background:${b.color}"></div></div></div>`;
  }).join("")}</div>`;
}
function trendChart() {
  const ms = months().slice(0, 6).reverse();
  const data = ms.map((m) => ({ m, s: summarize(m) }));
  const W = 460, H = 200, L = 46, B = 24, T = 10;
  const max = Math.max(1, ...data.map((d) => Math.max(d.s.income, d.s.spend)));
  const nice = Math.ceil(max / 1000) * 1000 || 1000;
  const y = (v) => T + (H - T - B) * (1 - v / nice);
  const bw = (W - L - 10) / data.length;
  const order = ["fixed", "invest", "save", "guilt", "none"];
  const ticks = [0, nice / 2, nice];
  let bars = "";
  data.forEach((d, i) => {
    const x = L + i * bw + bw * 0.2, w = bw * 0.6;
    let acc = 0;
    for (const k of order) {
      const v = d.s.buckets[k]; if (!v) continue;
      const y1 = y(acc + v), y0 = y(acc);
      bars += `<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0, y0 - y1)}" fill="${(BUCKETS[k] || { color: "var(--b-none)" }).color}"><title>${shortMonth(d.m)} ${esc((BUCKETS[k] || { label: "Uncategorized" }).label)}: ${money(v, { cents: false })}</title></rect>`;
      acc += v;
    }
    if (d.s.income) bars += `<line x1="${x - 4}" x2="${x + w + 4}" y1="${y(d.s.income)}" y2="${y(d.s.income)}" stroke="var(--ink)" stroke-width="2"><title>${shortMonth(d.m)} income: ${money(d.s.income, { cents: false })}</title></line>`;
    bars += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${shortMonth(d.m)}</text>`;
  });
  const grid = ticks.map((t) => `<line x1="${L}" x2="${W - 4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t >= 1000 ? "$" + t / 1000 + "k" : "$" + t}</text>`).join("");
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly spending by bucket with income marked">${grid}${bars}</svg></div>
    <div class="legend">${Object.values(BUCKETS).map((b) => `<span><i style="background:${b.color}"></i>${b.label}</span>`).join("")}<span><i style="background:var(--ink);height:2px"></i>Income</span></div>`;
}

/* ---------- CSV import ---------- */
function parseCSV(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; } else field += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(field); rows.push(row); row = []; field = ""; }
    else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((x) => x.trim()));
}
function parseAmount(s) {
  if (s == null) return NaN; s = String(s).trim(); if (!s) return NaN;
  const neg = /^\(.*\)$/.test(s) || /^-/.test(s) || /-$/.test(s);
  const n = parseFloat(s.replace(/[^0-9.]/g, ""));
  return neg ? -n : n;
}
function parseDate(s) {
  s = String(s || "").trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`; }
  const d = new Date(s); return isNaN(d) ? null : d.toISOString().slice(0, 10);
}
async function importCSV(file) {
  if (!file) return;
  const rows = parseCSV(await file.text());
  const hi = rows.findIndex((r) => r.some((c) => /date/i.test(c)));
  if (hi < 0) return toast("Couldn't find a Date column in that file.");
  const head = rows[hi].map((h) => h.trim().toLowerCase());
  const find = (re) => head.findIndex((h) => re.test(h));
  const ci = { date: find(/date/), desc: find(/desc|payee|name|memo|merchant|detail/), amt: find(/^amount|amount/), debit: find(/debit|withdraw/), credit: find(/credit|deposit/) };
  if (ci.desc < 0 || (ci.amt < 0 && ci.debit < 0)) return toast("Couldn't find description and amount columns.");
  const parsed = rows.slice(hi + 1).map((r) => {
    const date = parseDate(r[ci.date]);
    let amount = ci.amt >= 0 ? parseAmount(r[ci.amt]) : (parseAmount(r[ci.credit]) || 0) - Math.abs(parseAmount(r[ci.debit]) || 0);
    return { date, desc: (r[ci.desc] || "").trim(), amount: Math.round(amount * 100) / 100 };
  }).filter((t) => t.date && t.desc && isFinite(t.amount));
  if (!parsed.length) return toast("No transactions found in that file.");
  const posShare = parsed.filter((t) => t.amount > 0).length / parsed.length;
  modal(`<h2>Import ${parsed.length} transactions</h2>
    <p class="muted" style="font-size:.88rem">From <b>${esc(file.name)}</b>, ${esc(parsed[parsed.length - 1].date)} to ${esc(parsed[0].date)}. Read on this device only.</p>
    <label class="field"><span>Account</span><select id="m-acct"><option value="">None</option>${S.data.accounts.map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select></label>
    <label class="row" style="gap:.5rem"><input id="m-flip" type="checkbox" ${posShare > 0.7 ? "checked" : ""}> <span>Spending shows as positive numbers in this file (flip signs)</span></label>
    <div class="tablewrap"><table><tbody>${parsed.slice(0, 5).map((t) => `<tr><td class="mono muted">${esc(t.date)}</td><td>${esc(t.desc)}</td><td class="amt">${money(t.amount)}</td></tr>`).join("")}</tbody></table></div>
    <div class="actions"><button type="button" class="btn" data-m="cancel">Cancel</button><button class="btn primary" type="submit">Import</button></div>`, (f) => {
    const flip = f.querySelector("#m-flip").checked, acct = v(f, "m-acct");
    const seen = new Set(S.data.transactions.map((t) => t.date + "|" + t.amount + "|" + t.desc));
    let added = 0;
    mutate((d) => {
      if (d.sample) { d.transactions = []; d.accounts = []; d.goals = []; d.sample = false; }
      for (const t of parsed) {
        const amount = flip ? -t.amount : t.amount;
        const k = t.date + "|" + amount + "|" + t.desc;
        if (seen.has(k)) continue; seen.add(k);
        d.transactions.push({ id: uid(), date: t.date, desc: t.desc, amount, category: autoCategory(t.desc, amount), accountId: acct });
        added++;
      }
    });
    selMonth = months()[0];
    render();
    toast(`Imported ${added} new transactions${parsed.length - added ? `, skipped ${parsed.length - added} duplicates` : ""}.`);
  });
}

/* ---------- backups ---------- */
async function downloadBackup() {
  await saveNow();
  const text = JSON.stringify(S.lastEnvelope);
  const name = `rich-life-ledger-backup-${todayISO()}.json`;
  try {
    const dl = window.claude?.use ? await window.claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: name, data: text }); toast("Backup saved. It's encrypted with your passphrase."); return; }
  } catch (e) { if (e?.code === "declined") return; }
  modal(`<h2>Encrypted backup</h2><p class="muted" style="font-size:.88rem">Copy this text into a file named <span class="mono">${esc(name)}</span>. It can only be opened with your passphrase.</p>
    <textarea id="m-backup" rows="6" readonly class="mono" style="font-size:.75rem">${esc(text)}</textarea>
    <div class="actions"><button type="button" class="btn" data-m="cancel">Close</button><button class="btn primary" type="submit">Copy</button></div>`, (f) => {
    const ta = f.querySelector("#m-backup");
    navigator.clipboard?.writeText(ta.value).then(() => toast("Copied."), () => { ta.select(); toast("Press Ctrl+C or Cmd+C to copy."); });
    return false;
  });
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-view]");
  if (nav && S.data) { e.preventDefault(); view = nav.dataset.view; try { history.replaceState(null, "", "#" + view); } catch {} render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest("[data-action]");
  if (!a || !S.data || a.tagName === "SELECT") return;
  const id = a.dataset.id;
  switch (a.dataset.action) {
    case "lock": lock(); break;
    case "backup": downloadBackup(); break;
    case "settings": settingsModal(); break;
    case "addtx": txModal(); break;
    case "edittx": txModal(S.data.transactions.find((t) => t.id === id)); break;
    case "addacct": acctModal(); break;
    case "editacct": acctModal(S.data.accounts.find((x) => x.id === id)); break;
    case "addgoal": goalModal(); break;
    case "editgoal": goalModal(S.data.goals.find((x) => x.id === id)); break;
    case "filteruncat": txFilter = { q: "", cat: "Uncategorized", month: "" }; render(); break;
    case "clearsample": mutate((d) => { d.transactions = []; d.accounts = []; d.goals = []; d.sample = false; d.plan.takeHome = 0; d.richLife = ""; }); toast("Example data cleared. Add an account or import a CSV to begin."); break;
    case "contribute": {
      const g = S.data.goals.find((x) => x.id === id);
      modal(`<h2>Deposit to ${esc(g.name)}</h2><label class="field"><span>Amount</span><input id="m-amt" type="number" step="1" min="0" required value="${g.monthly || ""}"></label>${actions(false)}`, (f) => {
        const n = +v(f, "m-amt"); if (!n) return false; mutate(() => (g.saved = Math.round((g.saved + n) * 100) / 100));
      });
      break;
    }
    case "richlife":
      modal(`<h2>My Rich Life</h2><p class="muted" style="font-size:.88rem">Ramit asks you to be specific. Not "travel more" but "fly business class to Tokyo once a year." What would you spend on without guilt?</p>
        <textarea id="m-rl" rows="4">${esc(S.data.richLife)}</textarea>${actions(false)}`, (f) => mutate((d) => (d.richLife = v(f, "m-rl").trim())));
      break;
    case "addcat":
      modal(`<h2>Add category</h2><label class="field"><span>Name</span><input id="m-name" type="text" required></label>
        <label class="field"><span>Bucket</span><select id="m-b">${Object.entries(BUCKETS).map(([k, b]) => `<option value="${k}">${b.label}</option>`).join("")}<option value="income">Income</option><option value="transfer">Transfer (ignored)</option></select></label>${actions(false)}`, (f) => {
        const name = v(f, "m-name").trim(); if (!name || S.data.categories.some((c) => c.name === name)) return false;
        mutate((d) => d.categories.splice(d.categories.length - 2, 0, { name, bucket: v(f, "m-b") }));
      });
      break;
    case "moretips": {
      const key = a.dataset.key;
      modal(`<h2>From <i>I Will Teach You to Be Rich</i></h2>${RAMIT[key].map((t) => `<div class="ramit"><p>${esc(t.t)}</p><span class="src">${esc(t.s)}</span></div>`).join("")}
        <p class="muted" style="font-size:.78rem">Principles paraphrased from Ramit Sethi's book (Workman, 2nd ed. 2019). This app isn't affiliated with Ramit Sethi, and none of this is personal financial advice.</p>
        <div class="actions"><button type="button" class="btn" data-m="cancel">Close</button></div>`);
      break;
    }
  }
});
document.addEventListener("change", (e) => {
  if (!S.data) return;
  const t = e.target;
  if (t.id === "csvfile") return importCSV(t.files[0]);
  if (t.id === "dashmonth" || t.id === "planmonth") { selMonth = t.value; render(); return; }
  if (t.id === "txmonth") { txFilter.month = t.value; render(); return; }
  if (t.id === "txcat") { txFilter.cat = t.value; render(); return; }
  if (t.id === "takehome") { mutate((d) => (d.plan.takeHome = Math.max(0, +t.value || 0))); return; }
  if (t.dataset.action === "setcat") {
    const tx = S.data.transactions.find((x) => x.id === t.dataset.id);
    mutate((d) => { tx.category = t.value; d.rules[normDesc(tx.desc)] = t.value; });
    toast(`Saved. Future "${tx.desc.slice(0, 24)}" transactions will go to ${t.value}.`);
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id !== "txq" || !S.data) return;
  txFilter.q = e.target.value;
  clearTimeout(document._q);
  document._q = setTimeout(() => { const pos = e.target.selectionStart; render(); const el = $("#txq"); el.focus(); el.setSelectionRange(pos, pos); }, 250);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#modal-root").innerHTML = ""; });
addEventListener("pagehide", () => { if (S.key && S.data) saveNow(); });

boot();
</script>
